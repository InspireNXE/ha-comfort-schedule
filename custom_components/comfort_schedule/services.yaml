set_schedule:
  target:
    entity:
      integration: comfort_schedule
      domain: climate
  fields:
    schedule:
      required: true
      example: '[[{"start": 0, "heat": 65, "cool": 70, "label": "Sleep", "mode": null, "fan": "Auto low"}], [...], [...], [...], [...], [...], [...]]'
      selector:
        object:
    label_colors:
      example: '{"Away": "#8C98A5", "Home": "#2E9E6B"}'
      selector:
        object:

set_hold:
  target:
    entity:
      integration: comfort_schedule
      domain: climate
  fields:
    heat:
      selector:
        number:
          min: 0
          max: 100
          step: 0.5
          mode: box
    cool:
      selector:
        number:
          min: 0
          max: 100
          step: 0.5
          mode: box
    duration:
      selector:
        select:
          options:
            - next_period
            - "120"
            - "240"
            - indefinite
          translation_key: hold_duration

resume_schedule:
  target:
    entity:
      integration: comfort_schedule
      domain: climate

pause_schedule:
  target:
    entity:
      integration: comfort_schedule
      domain: climate

set_vacation:
  target:
    entity:
      integration: comfort_schedule
      domain: climate
  fields:
    start:
      example: "2026-12-18 17:00:00"
      selector:
        datetime:
    end:
      required: true
      example: "2026-12-21 15:00:00"
      selector:
        datetime:
    heat:
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 0.5
          mode: box
    cool:
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 0.5
          mode: box

cancel_vacation:
  target:
    entity:
      integration: comfort_schedule
      domain: climate

filter_changed:
  target:
    entity:
      integration: comfort_schedule
      domain: climate

apply_suggestion:
  target:
    entity:
      integration: comfort_schedule
      domain: climate
  fields:
    id:
      required: true
      example: "3f9a2c1d0b"
      selector:
        text:

dismiss_suggestion:
  target:
    entity:
      integration: comfort_schedule
      domain: climate
  fields:
    id:
      required: true
      example: "3f9a2c1d0b"
      selector:
        text:
