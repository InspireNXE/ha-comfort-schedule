<!doctype html>
<meta charset="utf-8">
<title>emu test</title>
<pre id="out">running…</pre>
<script type="module">
const out = document.getElementById('out');
try {
  const get = async (p) => { const r = await fetch(p); if (!r.ok) throw new Error(p + ' ' + r.status); return r.text(); };
  const { loadPyodide } = await import('https://cdn.jsdelivr.net/pyodide/v0.27.2/full/pyodide.mjs');
  const pyodide = await loadPyodide();
  const sources = {};
  for (const n of ['const', 'schedule', 'health', 'runtime', 'learning', 'suggestions', 'forecast', 'controller']) sources[n] = await get('/' + n + '.py');
  pyodide.globals.set('SOURCES', pyodide.toPy(sources));
  await pyodide.runPythonAsync(await get('/emu_test.py') + '\nawait run()\n');
  out.textContent = pyodide.globals.get('results').toJs().join('\n');
} catch (e) { out.textContent = 'ERROR ' + (e.stack || e); }
document.title = 'done';
</script>
